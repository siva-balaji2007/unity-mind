services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: unitymind-postgres
    environment:
      POSTGRES_DB: unitymind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sivabalaji007
    ports:
      - "5433:5432"
    volumes:
      - unitymind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unitymind"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  unitymind-postgres-data:


